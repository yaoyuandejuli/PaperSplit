# 自动构建并发布 Docker 镜像到 GitHub Container Registry (GHCR)
# ------------------------------------------------------------
# 每次 push 到 master 都会重新构建并推送 latest 标签，
# 之后在飞牛 NAS / 群晖 / 任意 Docker 环境即可：
#   docker pull ghcr.io/yaoyuandejuli/papersplit:latest
#   docker run -d --name papersplit -p 5173:5173 ghcr.io/yaoyuandejuli/papersplit:latest
#
# 注意：仓库需开启 Packages 写入权限（默认对公共仓库开放）。
# 首次使用前请在 GitHub 仓库 Settings → Actions → General
# 把 Workflow permissions 设为 "Read and write permissions"。
#
# Action 版本固定到 commit SHA：
#   主版本 tag（如 @v4）可被上游重新指向任意代码，而本 workflow 拥有
#   packages: write 权限，供应链风险会被放大。固定 SHA 后，
#   上游发新版本不会自动生效，需手动更新下面的 SHA（注释里标注了版本号）。
# ------------------------------------------------------------
name: Publish Docker image

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 多架构构建前必须注册 QEMU 的 binfmt 处理器，
      # 否则 arm64 阶段会因缺少模拟器而报 exec format error。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # dist/ 与 docs/ 是两份重复的构建产物，发布前必须校验二者一致，
      # 否则可能把过期内容推到 gh-pages 分支（线上站点）。
      - name: Verify dist/ and docs/ are in sync
        run: |
          if [ ! -f dist/index.html ] || [ ! -f docs/index.html ]; then
            echo "::error::dist/ 或 docs/ 缺少 index.html"
            exit 1
          fi
          if ! diff -q dist/index.html docs/index.html >/dev/null 2>&1; then
            echo "::error::dist/ 与 docs/ 不同步，请执行 rm -rf docs && cp -r dist docs 后再提交"
            exit 1
          fi
          echo "dist/ 与 docs/ 已同步"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          # 同时构建 amd64 与 arm64 —— 飞牛 NAS / 群晖常见为 ARM64 芯片，
          # 只发 amd64 会在 ARM 设备上退化为模拟执行（极慢）或直接报 exec format error。
          platforms: linux/amd64,linux/arm64
          # 只缓存 amd64：多架构下 mode=max 的缓存体积会翻倍，
          # 容易超出 GHCR 缓存配额而被静默丢弃；arm64 构建本身很快，
          # 缓存收益低但配额占用高。
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64
