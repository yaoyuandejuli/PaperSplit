# PaperSplit · nginx 版（推荐，多阶段构建）
# ------------------------------------------------------------
# 两种用法任选其一：
#
# ① 从源码构建并运行（无需在本机装 Node）：
#      docker compose -f deploy/docker-compose.yml up -d --build
#    容器内会自动用源码重新生成 dist/ 并用 nginx 托管，始终是最新代码。
#
# ② 直接拉取已构建好的镜像（需先由 .github/workflows/publish-docker.yml
#    把镜像发布到 GHCR，详见下方 README「Docker 部署」一节）：
#      docker pull ghcr.io/yaoyuandejuli/papersplit:latest
#      docker run -d --name papersplit -p 8080:80 ghcr.io/yaoyuandejuli/papersplit:latest
#
# 飞牛 NAS：把仓库克隆到 /vol1/docker/papersplit 后，在「Docker → 项目」里
# 指向本文件并部署；或 SSH 进 NAS 执行上面的命令。
# 完成后浏览器访问 http://<NAS的IP>:8080
#
# 端口：默认对外暴露 8080。如需修改，改 .env 里的 PORT 即可
#      （例如 PORT=9090），无需改动本文件。
# ------------------------------------------------------------
services:
  papersplit:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ghcr.io/yaoyuandejuli/papersplit:latest
    container_name: papersplit
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # 静态站点不吃 CPU，限制一下避免在 NAS 上抢占过多资源
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
