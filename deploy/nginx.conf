server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 本项目为单页应用，所有路由都落到 index.html；
    # 带内容哈希的静态资源（/assets/*）不会被这一条命中，仍走下面的长缓存。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产物文件名含内容哈希，可放心长期缓存，提升二次访问速度
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # NAS 环境下减少无谓的磁盘写入
    access_log off;
}
