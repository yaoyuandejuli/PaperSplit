server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 本项目为单页应用，所有路由都落到 index.html；
    # 带内容哈希的静态资源（/assets/*）不会被这一条命中，仍走下面的长缓存。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 产物文件名含内容哈希，可放心长期缓存，提升二次访问速度
    # 注意：不要同时使用 expires 指令 —— 它会自动再写一条 Cache-Control 头，
    # 与下面的 add_header 叠加后会出现两个 Cache-Control 头。这里只用 add_header。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
    }

    # index.html 本身不带哈希，必须每次回源校验，否则发版后用户拿不到新版本
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ------------------------------------------------------------
    # 压缩：主 JS 约 1.1MB、pdf.worker 约 1.0MB、pdf-core 约 400KB，
    # 开启 gzip 后传输量可降到约 1/4，对内网/弱网 NAS 提升非常明显。
    # （上游 Vite 构建默认不产出 .gz，这里由 nginx 实时压缩）
    # ------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff
        font/woff2;
    # woff2 / png / jpg / pdf 本身已压缩，gzip_types 未列出它们，不会被二次压缩
    # （gzip 只对 gzip_types 中声明的类型生效）
    gzip_disable "msie6";

    # NAS 环境下减少无谓的磁盘写入
    access_log off;
}
