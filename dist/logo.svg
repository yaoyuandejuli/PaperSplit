<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PaperSplit">
  <defs>
    <linearGradient id="psBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="psPaper">
      <rect x="120" y="92" width="272" height="324" rx="22"/>
    </clipPath>
    <clipPath id="psSeal">
      <rect x="120" y="92" width="70" height="324"/>
    </clipPath>
    <pattern id="psHatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="18" height="18" fill="#ffffff" opacity="0.22"/>
      <rect width="7" height="18" fill="#ffffff" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- 圆角底板 -->
  <rect width="512" height="512" rx="112" fill="url(#psBg)"/>

  <!-- 纸张（A3 被切开） -->
  <rect x="120" y="92" width="272" height="324" rx="22" fill="#ffffff"/>

  <!-- 左侧密封区：斜纹阴影 = 导出时会被裁掉的部分 -->
  <g clip-path="url(#psSeal)" stroke="#cbd5e1" stroke-width="7" stroke-linecap="butt">
    <line x1="190" y1="416" x2="514" y2="92"/>
    <line x1="180" y1="416" x2="504" y2="92"/>
    <line x1="170" y1="416" x2="494" y2="92"/>
    <line x1="160" y1="416" x2="484" y2="92"/>
    <line x1="150" y1="416" x2="474" y2="92"/>
    <line x1="140" y1="416" x2="464" y2="92"/>
    <line x1="130" y1="416" x2="454" y2="92"/>
    <line x1="120" y1="416" x2="444" y2="92"/>
    <line x1="110" y1="416" x2="434" y2="92"/>
    <line x1="100" y1="416" x2="424" y2="92"/>
    <line x1="90" y1="416" x2="414" y2="92"/>
    <line x1="80" y1="416" x2="404" y2="92"/>
    <line x1="70" y1="416" x2="394" y2="92"/>
    <line x1="60" y1="416" x2="384" y2="92"/>
    <line x1="50" y1="416" x2="374" y2="92"/>
    <line x1="40" y1="416" x2="364" y2="92"/>
    <line x1="30" y1="416" x2="354" y2="92"/>
    <line x1="20" y1="416" x2="344" y2="92"/>
    <line x1="10" y1="416" x2="334" y2="92"/>
    <line x1="0" y1="416" x2="324" y2="92"/>
    <line x1="-10" y1="416" x2="314" y2="92"/>
    <line x1="-20" y1="416" x2="304" y2="92"/>
    <line x1="-30" y1="416" x2="294" y2="92"/>
    <line x1="-40" y1="416" x2="284" y2="92"/>
    <line x1="-50" y1="416" x2="274" y2="92"/>
    <line x1="-60" y1="416" x2="264" y2="92"/>
    <line x1="-70" y1="416" x2="254" y2="92"/>
    <line x1="-80" y1="416" x2="244" y2="92"/>
    <line x1="-90" y1="416" x2="234" y2="92"/>
    <line x1="-100" y1="416" x2="224" y2="92"/>
    <line x1="-110" y1="416" x2="214" y2="92"/>
    <line x1="-120" y1="416" x2="204" y2="92"/>
    <line x1="-130" y1="416" x2="194" y2="92"/>
    <line x1="-140" y1="416" x2="184" y2="92"/>
    <line x1="-150" y1="416" x2="174" y2="92"/>
    <line x1="-160" y1="416" x2="164" y2="92"/>
    <line x1="-170" y1="416" x2="154" y2="92"/>
    <line x1="-180" y1="416" x2="144" y2="92"/>
    <line x1="-190" y1="416" x2="134" y2="92"/>
    <line x1="-200" y1="416" x2="124" y2="92"/>
    <line x1="-210" y1="416" x2="114" y2="92"/>
  </g>

  <!-- 密封区裁切边界 -->
  <line x1="190" y1="92" x2="190" y2="416" stroke="#94a3b8" stroke-width="6" stroke-dasharray="15 13" stroke-linecap="round"/>

  <!-- 分割线 -->
  <line x1="262" y1="92" x2="262" y2="416" stroke="#1e293b" stroke-width="12" stroke-dasharray="40 24" stroke-linecap="round"/>

  <!-- 剪刀：深色描边打底 + 白色线条 -->
  <g transform="translate(318 296) scale(7)" fill="none" stroke-linecap="round">
    <g stroke="#1e293b" stroke-width="4.6">
      <circle cx="7" cy="20" r="6"/>
      <circle cx="19" cy="20" r="6"/>
      <path d="M11.4 15.6 L24 3.4 M15.6 15.6 L24 3.4"/>
    </g>
    <g stroke="#ffffff" stroke-width="2.4">
      <circle cx="7" cy="20" r="6"/>
      <circle cx="19" cy="20" r="6"/>
      <path d="M11.4 15.6 L24 3.4 M15.6 15.6 L24 3.4"/>
    </g>
  </g>
</svg>
